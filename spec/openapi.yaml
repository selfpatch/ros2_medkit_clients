  /faults:
    delete:
      description: Clears the faults this gateway's own FaultManager holds. In an
        aggregated deployment the peers are not touched, which the 204 reports through
        `X-Medkit-Local-Only`; clear those per peer. Which faults go is the `status`
        filter's decision, and omitting it does not mean all of them - it means pending
        and confirmed, leaving already-cleared and healed records in place. Faults
        on entities another client has locked are skipped silently and the request
        still answers 204, with nothing on the response naming what survived.
      operationId: clearAllFaults
      parameters:
      - description: Identifies the calling client for lock ownership. Faults on entities
          locked by a different client are silently skipped rather than cleared, and
          the request still answers 204 - re-read the entity's faults to see what
          survived.
        in: header
        name: X-Client-Id
        required: false
        schema:
          type: string
