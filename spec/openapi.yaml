          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
        '503':
          $ref: '#/components/responses/GenericError'
      summary: Create trigger for function
      tags:
      - Triggers
  /functions/{function_id}/triggers/{trigger_id}:
    delete:
      description: Deletes a trigger from this function.
      operationId: deleteFunctionTrigger
      parameters:
      - description: The function identifier
        in: path
        name: function_id
        required: true
        schema:
          type: string
      - description: The trigger identifier
        in: path
        name: trigger_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Delete trigger for function
      tags:
      - Triggers
    get:
      description: Returns details of a specific trigger on this function.
      operationId: getFunctionTrigger
      parameters:
      - description: The function identifier
        in: path
        name: function_id
        required: true
        schema:
          type: string
      - description: The trigger identifier
        in: path
        name: trigger_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trigger'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Get trigger for function
      tags:
      - Triggers
    put:
      description: Updates a trigger configuration on this function.
      operationId: updateFunctionTrigger
      parameters:
      - description: The function identifier
        in: path
        name: function_id
        required: true
        schema:
          type: string
      - description: The trigger identifier
        in: path
        name: trigger_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerUpdateRequest'
        description: ''
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trigger'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Update trigger for function
      tags:
      - Triggers
  /functions/{function_id}/triggers/{trigger_id}/events:
    get:
      description: Server-Sent Events stream for trigger notifications on this function.
        Each frame's `data:` field is a TriggerEventFrame. An idle stream sends `:keepalive`
        comment lines every 15s, which carry no JSON.
      operationId: streamFunctionTriggerEvents
      parameters:
      - description: The function identifier
        in: path
        name: function_id
        required: true
        schema:
          type: string
      - description: The trigger identifier
        in: path
        name: trigger_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TriggerEventFrame'
          description: Server-Sent Events stream
          headers:
            Cache-Control:
              description: Always `no-cache`; event streams are never cached.
              schema:
                type: string
            X-Accel-Buffering:
              description: Always `no`; disables response buffering in nginx-style
                proxies.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
        '503':
          $ref: '#/components/responses/GenericError'
      summary: SSE events stream for trigger on function
      tags:
      - Triggers
  /health:
    get:
      description: Returns gateway health status.
      operationId: getHealth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Health check
      tags:
      - Server
  /updates:
    get:
      description: Lists all registered software updates.
      operationId: listUpdates
      parameters:
      - description: Filter by update origin identifier
        in: query
        name: origin
        required: false
        schema:
          type: string
      - description: Filter by target version
        in: query
        name: target-version
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateList'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: List software updates
      tags:
      - Updates
    post:
      description: Registers a new software update descriptor.
      operationId: registerUpdate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRegisterRequest'
        description: ''
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRegisterResponse'
          description: Update registered
          headers:
            Location:
              description: Absolute path of the created resource, API prefix included
                (`/api/v1/...`).
              schema:
                format: uri-reference
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Register a software update
      tags:
      - Updates
  /updates/{update_id}:
    delete:
      description: Removes an update registration.
      operationId: deleteUpdate
      parameters:
      - description: The software update identifier
        in: path
        name: update_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '409':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Delete update
      tags:
      - Updates
    get:
      description: Returns details of a specific update.
      operationId: getUpdate
      parameters:
      - description: The software update identifier
        in: path
        name: update_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDetail'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Get update details
      tags:
      - Updates
  /updates/{update_id}/automated:
    put:
      description: Runs a fully automated update (prepare + execute).
      operationId: automateUpdate
      parameters:
      - description: The software update identifier
        in: path
        name: update_id
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Automated update started
          headers:
            Location:
              description: Absolute path of the resource whose status tracks this
                request, API prefix included.
              schema:
                format: uri-reference
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '409':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Run automated update
      tags:
      - Updates
  /updates/{update_id}/execute:
    put:
      description: Starts executing a prepared update.
      operationId: executeUpdate
      parameters:
      - description: The software update identifier
        in: path
        name: update_id
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Update execution started
          headers:
            Location:
              description: Absolute path of the resource whose status tracks this
                request, API prefix included.
              schema:
                format: uri-reference
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '409':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Execute update
      tags:
      - Updates
  /updates/{update_id}/prepare:
    put:
      description: Prepares an update for execution (downloads, validates).
      operationId: prepareUpdate
      parameters:
      - description: The software update identifier
        in: path
        name: update_id
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Update preparation started
          headers:
            Location:
              description: Absolute path of the resource whose status tracks this
                request, API prefix included.
              schema:
                format: uri-reference
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '409':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Prepare update for execution
      tags:
      - Updates
  /updates/{update_id}/status:
    get:
      description: Returns the current status and progress of an update.
      operationId: getUpdateStatus
      parameters:
      - description: The software update identifier
        in: path
        name: update_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Get update status
      tags:
      - Updates
  /version-info:
    get:
      description: Returns SOVD specification version and vendor info.
      operationId: getVersionInfo
      parameters:
      - description: 'Present at any value: answer from this gateway alone and do
          not query aggregated peers. The gateway sets it on its own outbound peer
          requests, so bidirectional aggregation terminates at the first peer for
          this operation.'
        in: header
        name: X-Medkit-No-Fan-Out
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: SOVD version information
      tags:
      - Server
  /{entity_path}/docs:
    get:
      description: 'Returns the OpenAPI 3.1 document scoped to one entity, resource
        collection or resource - the SOVD context-specific capability description.
        404 when the prefix does not resolve, which is narrower than the paths this
        gateway serves: `PathResolver` recognises the SOVD resource collections (`data`,
        `data-categories`, `data-groups`, `operations`, `faults`, `configurations`,
        `logs`, `bulk-data`, `cyclic-subscriptions`, `triggers`, `updates`, `hosts`)
        and no others, so `locks`, `status`, `scripts` and `fault-triggers` answer
        200 on the collection and 404 here. Read the root document for those.'
      operationId: getScopedCapabilityDescription
      parameters:
      - description: The entity or resource path the description is scoped to, without
          a leading slash - for example `apps`, `apps/temp_sensor` or `apps/temp_sensor/data`.
          It is a whole path rather than one segment, so its slashes must be sent
          unescaped.
        in: path
        name: entity_path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: OpenAPI specification document scoped to the requested path
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Scoped capability description
      tags:
      - Server
servers:
- description: Gateway server
  url: http://localhost:8080/api/v1
tags:
- description: Gateway health, metadata, and version info
  name: Server
- description: Entity discovery and hierarchy navigation
  name: Discovery
- description: Read and write ROS 2 topic data
  name: Data
- description: Execute ROS 2 service and action operations
  name: Operations
- description: Read and write ROS 2 node parameters
  name: Configuration
- description: Fault management and diagnostics
  name: Faults
- description: Application log access and configuration
  name: Logs
- description: Large file downloads (rosbags, snapshots)
  name: Bulk Data
- description: Cyclic data subscriptions and event streaming
  name: Subscriptions
- description: Event-driven condition monitoring and notifications
  name: Triggers
- description: Threshold rules on discovered data points that raise and auto-clear
    faults
  name: FaultTriggers
- description: Entity lock management for exclusive access
  name: Locking
- description: Diagnostic script upload, execution, and management
  name: Scripts
- description: Software update management
  name: Updates
- description: Entity status and lifecycle control (start, restart, shutdown)
  name: Lifecycle
- description: JWT-based authentication
  name: Authentication
