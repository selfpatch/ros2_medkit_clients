components:
  responses:
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuth2Error'
      description: The token is valid but lacks the scope this operation requires.
    GenericError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericError'
      description: SOVD GenericError response
    OAuth2Error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuth2Error'
      description: RFC 6749 section 5.2 error response.
    RateLimited:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericError'
      description: The client exceeded its request quota.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: string
        X-RateLimit-Limit:
          description: Requests permitted per window.
          schema:
            type: string
        X-RateLimit-Remaining:
          description: Requests left in the current window.
          schema:
            type: string
        X-RateLimit-Reset:
          description: Unix timestamp at which the window resets.
          schema:
            type: string
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuth2Error'
      description: Authentication is missing or the bearer token is invalid.
      headers:
        WWW-Authenticate:
          description: Bearer challenge, e.g. `Bearer realm="ros2_medkit_gateway",
            error="invalid_token"`.
          schema:
            type: string
  schemas:
    AcquireLockRequest:
      properties:
        break_lock:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Take the lock even though another client already holds one.
            Without it an existing lock answers 409 `lock-conflict`; with it, an existing
            lock the entity's configuration marks non-breakable answers 409 `lock-not-breakable`
            instead. Either way the 409 body carries the blocking lock's id in `parameters.existing_lock_id`.
        lock_expiration:
          description: How long the lock lives, in seconds from the moment the gateway
            grants it - a duration, unlike the `lock_expiration` on the Lock response,
            which is an ISO 8601 instant. Must be at least 1 and no more than the
            configured ceiling (`locking.default_max_expiration`, 3600 s unless a
            manifest overrides it for the entity); only the lower bound is a schema
            constraint, because the ceiling is deployment configuration. Extending
            a lock restarts the countdown from the new value - it does not add to
            what is left. Reaching the expiry is not the same as releasing the lock;
            the acquire operation says how they differ.
          minimum: 1.0
          type: integer
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Resource collections the lock covers, from `data`, `operations`,
            `configurations`, `faults`, `modes`, `scripts`, `bulk-data`, `logs` and
            `cyclic-subscriptions` (the set `valid_lock_scopes()` accepts; any other
            value is rejected with 400). Omitted or empty locks every collection.
      required:
      - lock_expiration
      type: object
    AppDetail:
      properties:
        _links:
          anyOf:
          - {}
          - type: 'null'
          description: 'HATEOAS relation map. Relations emitted today: self and collection
            (all entity types), parent (areas and components, when the entity has
            a parent), area (components), is-located-on and belongs-to (apps) - each
            an absolute path - and depends-on (apps and functions), an array of absolute
            paths.'
        belongs-to:
          anyOf:
          - type: string
          - type: 'null'
        bulk-data:
          type: string
        capabilities:
          anyOf:
          - items:
              $ref: '#/components/schemas/EntityCapability'
            type: array
          - type: 'null'
        configurations:
          type: string
        cyclic-subscriptions:
          type: string
        data:
          type: string
        data-categories:
          type: string
        data-groups:
          type: string
        depends-on:
          anyOf:
          - type: string
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
        fault-triggers:
          type: string
        faults:
          type: string
        id:
          type: string
        is-located-on:
          anyOf:
          - type: string
          - type: 'null'
        locks:
          anyOf:
          - type: string
          - type: 'null'
        logs:
          type: string
        name:
          type: string
        operations:
          type: string
        scripts:
          anyOf:
          - type: string
          - type: 'null'
        status:
          type: string
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
        translation_id:
          anyOf:
          - type: string
          - type: 'null'
        triggers:
          type: string
        type:
          enum:
          - area
          - component
          - app
          - function
          type: string
        x-medkit:
          anyOf:
          - $ref: '#/components/schemas/XMedkitApp'
          - type: 'null'
      required:
      - id
      - name
      - type
      - status
      - data
      - data-categories
      - data-groups
      - operations
      - configurations
