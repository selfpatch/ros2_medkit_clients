          anyOf:
          - type: string
          - type: 'null'
          description: Transport the trigger's events are delivered over. `sse` is
            the only value the gateway accepts and is what an omitted field means;
            anything else is rejected with 400.
        resource:
          type: string
        trigger_condition:
          additionalProperties: true
          description: 'The condition that fires the trigger: a flat object of `condition_type`
            plus that type''s own operands. The built-in types are `OnChange` (no
            operands), `OnChangeTo` (`target_value`), `EnterRange` and `LeaveRange`
