components:
  responses:
    GenericError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericError'
      description: SOVD GenericError response
  schemas:
    AuthCredentials:
      properties:
        password:
          type: string
        username:
          type: string
      required:
      - username
      - password
      type: object
    AuthTokenResponse:
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
        scope:
          type: string
        token_type:
          type: string
      required:
      - access_token
      - token_type
      - expires_in
      type: object
    BulkDataCategoryList:
      properties:
        items:
          items:
            type: string
          type: array
      required:
      - items
      type: object
    BulkDataDescriptor:
      properties:
        creation_date:
          description: ISO 8601 creation timestamp
          format: date-time
          type: string
        description:
          description: Human-readable description
          type: string
        id:
          type: string
        mimetype:
          description: MIME type of the file
          type: string
        name:
          type: string
        size:
          type: integer
        x-medkit:
          type: object
      required:
      - id
      - name
      type: object
    BulkDataDescriptorList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BulkDataDescriptor'
          type: array
      required:
      - items
      type: object
    ConfigurationDeleteMultiStatus:
      properties:
        entity_id:
          type: string
        results:
          items:
            properties:
              app_id:
                type: string
              error:
                type: string
              node:
                type: string
              success:
                type: boolean
            type: object
          type: array
      required:
      - entity_id
      - results
      type: object
    ConfigurationMetaData:
      properties:
        id:
          description: Configuration parameter ID
          type: string
        name:
          description: Parameter name
          type: string
        type:
          description: Parameter type (e.g. 'parameter')
          type: string
      required:
      - id
      - name
      - type
      type: object
    ConfigurationMetaDataList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ConfigurationMetaData'
          type: array
      required:
      - items
      type: object
    ConfigurationReadValue:
      properties:
        data:
          description: Configuration value (type varies by parameter)
        id:
          description: Configuration parameter ID
          type: string
      required:
      - id
      - data
      type: object
    ConfigurationWriteValue:
      properties:
        data:
          description: Configuration value to set (type varies by parameter)
      required:
      - data
      type: object
    CyclicSubscription:
      properties:
        event_source:
          description: Server-generated event source URI
          type: string
        id:
          type: string
        interval:
          description: Polling interval
          enum:
          - fast
          - normal
          - slow
          type: string
        observed_resource:
          description: Resource URI being observed
          type: string
        protocol:
          description: Transport protocol
          type: string
      required:
      - id
      - observed_resource
      - event_source
      - protocol
      - interval
      type: object
    CyclicSubscriptionCreateRequest:
      properties:
        duration:
          description: Subscription duration in seconds
          minimum: 1
          type: integer
        interval:
          enum:
          - fast
          - normal
          - slow
          type: string
        protocol:
          description: 'Transport protocol (default: sse)'
          type: string
        resource:
          description: Resource URI to subscribe to
          type: string
      required:
      - resource
      - interval
      - duration
      type: object
    CyclicSubscriptionList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CyclicSubscription'
          type: array
      required:
      - items
      type: object
    DataItem:
      properties:
        category:
          type: string
        id:
          type: string
        name:
          type: string
        x-medkit:
          type: object
      required:
      - id
      - name
      type: object
    DataItemList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DataItem'
          type: array
      required:
      - items
      type: object
    EntityDetail:
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        uri:
          type: string
      required:
      - id
      - name
      type: object
    EntityList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/EntityDetail'
          type: array
      required:
      - items
      type: object
    FaultDetail:
      properties:
        environment_data:
          properties:
            extended_data_records:
              properties:
                first_occurrence:
                  format: date-time
                  type: string
                last_occurrence:
                  format: date-time
                  type: string
              type: object
            snapshots:
              items:
                properties:
                  bulk_data_uri:
                    type: string
                  data:
                    description: Snapshot data
                  duration_sec:
                    type: number
                  format:
                    type: string
                  name:
                    type: string
                  size_bytes:
                    type: integer
                  type:
                    type: string
                  x-medkit:
                    type: object
                type: object
              type: array
          type: object
        item:
          properties:
            code:
              type: string
            fault_name:
              type: string
            severity:
              type: integer
            status:
              properties:
                aggregatedStatus:
                  enum:
                  - active
                  - passive
                  - cleared
                  type: string
                confirmedDTC:
                  type: string
                pendingDTC:
                  type: string
                testFailed:
                  type: string
              required:
              - aggregatedStatus
              type: object
          required:
          - code
          - severity
          - status
          type: object
        x-medkit:
          properties:
            occurrence_count:
              type: integer
            reporting_sources:
              items:
                type: string
              type: array
            severity_label:
              type: string
            status_raw:
              type: string
          type: object
      required:
      - item
      - environment_data
      type: object
    FaultList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/FaultListItem'
          type: array
      required:
      - items
      type: object
    FaultListItem:
      properties:
        description:
          type: string
        fault_code:
          type: string
        first_occurred:
          description: Unix timestamp (seconds with nanosecond fraction)
          type: number
        last_occurred:
          description: Unix timestamp (seconds with nanosecond fraction)
          type: number
        occurrence_count:
          type: integer
        reporting_sources:
          items:
            type: string
          type: array
        severity:
          description: Numeric severity level
          type: integer
        severity_label:
          enum:
          - INFO
          - WARN
          - ERROR
          - CRITICAL
          type: string
        status:
          type: string
      required:
      - fault_code
      - severity
      - status
      type: object
    GenericError:
      properties:
        error_code:
          type: string
        message:
          type: string
        parameters:
          type: object
      required:
      - error_code
      - message
      type: object
    HealthStatus:
      properties:
        discovery:
          description: Discovery subsystem status
          properties:
            linking:
              properties:
                binding_conflicts:
                  items:
                    type: string
                  type: array
                linked_count:
                  type: integer
                orphan_count:
                  type: integer
                warnings:
                  items:
                    type: string
                  type: array
              type: object
            mode:
              type: string
            pipeline:
              type: object
            strategy:
              type: string
          type: object
        status:
          type: string
        timestamp:
          type: integer
      required:
      - status
      type: object
    Lock:
      properties:
        id:
          type: string
        lock_expiration:
          format: date-time
          type: string
        owned:
          type: boolean
        scopes:
          items:
            type: string
          type: array
      required:
      - id
      - owned
      - lock_expiration
      type: object
    LockList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Lock'
          type: array
      required:
      - items
      type: object
    LogConfiguration:
      properties:
        max_entries:
          type: integer
        severity_filter:
          type: string
      required:
      - severity_filter
      - max_entries
      type: object
    LogEntry:
      properties:
        context:
          properties:
            file:
              type: string
            function:
              type: string
            line:
              type: integer
            node:
              type: string
          required:
          - node
          type: object
        id:
          description: Log entry ID (e.g. log_123)
          type: string
        message:
          type: string
        severity:
          type: string
        timestamp:
          format: date-time
          type: string
      required:
      - id
      - timestamp
      - severity
      - message
      type: object
    LogEntryList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/LogEntry'
          type: array
      required:
      - items
      type: object
    OperationDetail:
      properties:
        item:
          $ref: '#/components/schemas/OperationItem'
      required:
      - item
      type: object
    OperationExecution:
      properties:
        id:
          type: string
        progress:
          type: number
        result:
          type: object
        status:
          enum:
          - pending
          - running
          - completed
          - failed
          type: string
      required:
      - id
      - status
      type: object
    OperationExecutionList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/OperationExecution'
          type: array
      required:
      - items
      type: object
    OperationItem:
      properties:
        asynchronous_execution:
          description: Whether operation runs asynchronously
          type: boolean
        id:
          type: string
        name:
          type: string
        proximity_proof_required:
          description: Whether proximity proof is needed
          type: boolean
        x-medkit:
          type: object
      required:
      - id
      - name
      type: object
    OperationItemList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/OperationItem'
          type: array
      required:
      - items
      type: object
    RootOverview:
      properties:
        api_base:
          type: string
        auth:
          properties:
            algorithm:
              type: string
            enabled:
              type: boolean
            require_auth_for:
              type: string
          type: object
        capabilities:
          properties:
            async_actions:
              type: boolean
            authentication:
              type: boolean
            bulk_data:
              type: boolean
            configurations:
              type: boolean
            cyclic_subscriptions:
              type: boolean
            data_access:
              type: boolean
            discovery:
              type: boolean
            faults:
              type: boolean
            locking:
              type: boolean
            logs:
              type: boolean
            operations:
              type: boolean
            scripts:
              type: boolean
            tls:
              type: boolean
            triggers:
              type: boolean
            updates:
              type: boolean
            vendor_extensions:
              type: boolean
          type: object
        endpoints:
          items:
            type: string
          type: array
        name:
          type: string
        tls:
          properties:
            enabled:
              type: boolean
            min_version:
              type: string
          type: object
        version:
          type: string
      required:
      - name
      - version
      - api_base
      - endpoints
      - capabilities
      type: object
    ScriptExecution:
      properties:
        completed_at:
          type: string
        error:
          type: object
        id:
          type: string
        parameters:
          type: object
        progress:
          type: number
        started_at:
          type: string
        status:
          type: string
      required:
      - id
      - status
      type: object
    ScriptMetadata:
      properties:
        description:
          type: string
        href:
          type: string
        id:
          type: string
        managed:
          type: boolean
        name:
          type: string
        parameters_schema:
          type: object
        proximity_proof_required:
          type: boolean
      required:
      - id
      - name
      type: object
    ScriptMetadataList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ScriptMetadata'
          type: array
      required:
      - items
      type: object
    ScriptUploadResponse:
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      type: object
    Trigger:
      properties:
        event_source:
          description: Server-generated event source URI
          type: string
        id:
          type: string
        lifetime:
          description: Trigger lifetime in seconds
          type: number
        log_settings:
          type: object
        multishot:
          description: Whether trigger fires multiple times
          type: boolean
        observed_resource:
          description: Resource URI being observed
          type: string
        path:
          description: Notification delivery path
          type: string
        persistent:
          description: Whether trigger survives server restarts
          type: boolean
        protocol:
          description: Transport protocol
          type: string
        status:
          enum:
          - active
          - terminated
          type: string
        trigger_condition:
          properties:
            condition_type:
              type: string
          required:
          - condition_type
          type: object
      required:
      - id
      - status
      - observed_resource
      - event_source
      - protocol
      - trigger_condition
      type: object
    TriggerCreateRequest:
      properties:
        lifetime:
          minimum: 1
          type: integer
        log_settings:
          type: object
        multishot:
          type: boolean
        path:
          type: string
        persistent:
          type: boolean
        protocol:
          description: 'Transport protocol (default: sse)'
          type: string
        resource:
          description: Resource URI to observe
          type: string
        trigger_condition:
          properties:
            condition_type:
              type: string
          required:
          - condition_type
          type: object
      required:
      - resource
      - trigger_condition
      type: object
    TriggerList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Trigger'
          type: array
      required:
      - items
      type: object
    TriggerUpdateRequest:
      properties:
        lifetime:
          description: New lifetime in seconds
          minimum: 1
          type: integer
      required:
      - lifetime
      type: object
    UpdateList:
      properties:
        items:
          items:
            type: string
          type: array
      required:
      - items
      type: object
    UpdateStatus:
      properties:
        error:
          type: string
        progress:
          type: number
        status:
          enum:
          - pending
          - inProgress
          - completed
          - failed
          type: string
        sub_progress:
          items:
            properties:
              name:
                type: string
              progress:
                type: number
            required:
            - name
            - progress
            type: object
          type: array
      required:
      - status
      type: object
    VersionInfo:
      properties:
        items:
          items:
            properties:
              base_uri:
                type: string
              vendor_info:
                properties:
                  name:
                    type: string
                  version:
                    type: string
                required:
                - version
                - name
                type: object
              version:
                type: string
            required:
            - version
            - base_uri
            type: object
          type: array
      required:
      - items
      type: object
info:
  contact:
    name: selfpatch.ai
    url: https://selfpatch.ai
  description: SOVD-compatible REST API for ROS 2 diagnostics and control. See https://selfpatch.github.io/ros2_medkit/
    for documentation.
  title: ROS 2 Medkit Gateway
  version: 0.4.0
  x-sovd-version: 1.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Returns gateway metadata, available endpoints, and capabilities.
      operationId: getRoot
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootOverview'
          description: API metadata
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: API overview
      tags:
      - Server
  /apps:
    get:
      description: Lists all discovered apps (ROS 2 nodes) in the system.
      operationId: listApps
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityList'
          description: App list
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: List apps
      tags:
      - Discovery
  /apps/{app_id}:
    get:
      description: Returns app details with capabilities and resource collection URIs.
      operationId: getApp
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityDetail'
          description: Entity details with capabilities
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Get app details
      tags:
      - Discovery
  /apps/{app_id}/bulk-data:
    get:
      description: Lists bulk-data categories (e.g., rosbag snapshots) for this app.
      operationId: listAppBulkDataCategories
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDataCategoryList'
          description: Category list
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: List bulk-data categories for app
      tags:
      - Bulk Data
  /apps/{app_id}/bulk-data/{category_id}:
    get:
      description: Lists downloadable files in a bulk-data category for this app.
      operationId: listAppBulkDataDescriptors
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The bulk data category identifier
        in: path
        name: category_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDataDescriptorList'
          description: Descriptor list
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: List bulk-data descriptors for app
      tags:
      - Bulk Data
    post:
      description: Uploads a file to a bulk-data category for this app.
      operationId: uploadAppBulkData
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The bulk data category identifier
        in: path
        name: category_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              format: binary
              type: string
        description: File to upload
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDataDescriptor'
          description: File uploaded
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Upload bulk-data for app
      tags:
      - Bulk Data
  /apps/{app_id}/bulk-data/{category_id}/{file_id}:
    delete:
      description: Deletes a bulk-data file for this app.
      operationId: deleteAppBulkData
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The bulk data category identifier
        in: path
        name: category_id
        required: true
        schema:
          type: string
      - description: The bulk data file identifier
        in: path
        name: file_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: File deleted
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Delete bulk-data file for app
      tags:
      - Bulk Data
    get:
      description: Downloads a bulk-data file (binary content).
      operationId: downloadAppBulkData
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The bulk data category identifier
        in: path
        name: category_id
        required: true
        schema:
          type: string
      - description: The bulk data file identifier
        in: path
        name: file_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                format: binary
                type: string
          description: File content
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Download bulk-data file for app
      tags:
      - Bulk Data
  /apps/{app_id}/configurations:
    delete:
      description: Resets all configuration parameters for this app.
      operationId: deleteAllAppConfigurations
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: All configurations deleted
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationDeleteMultiStatus'
          description: Partial success - some nodes failed
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Delete all configurations for app
      tags:
      - Configuration
    get:
      description: Lists all ROS 2 node parameters for this app.
      operationId: listAppConfigurations
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationMetaDataList'
          description: Configuration list
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: List configurations for app
      tags:
      - Configuration
  /apps/{app_id}/configurations/{config_id}:
    delete:
      description: Resets a configuration parameter to its default for this app.
      operationId: deleteAppConfiguration
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The configuration parameter identifier (ROS 2 parameter name)
        in: path
        name: config_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Configuration deleted
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Delete configuration for app
      tags:
      - Configuration
    get:
      description: Returns a specific ROS 2 node parameter for this app.
      operationId: getAppConfiguration
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The configuration parameter identifier (ROS 2 parameter name)
        in: path
        name: config_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationReadValue'
          description: Configuration parameter
        '400':
