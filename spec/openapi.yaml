  /components/{component_id}/status:
    get:
      description: Reports whether the entity is `ready` or `notReady`, and which
        lifecycle transitions can be requested on it. A registered LifecycleProvider
        answers both; the transition fields it returns are the transitions it implements,
        and they are the only place the document commits to a transition being available
        on a given entity. Without a provider the gateway derives readiness itself
        and returns no transition fields at all, which is the same entity for which
        every `PUT /{entity}/status/{action}` answers 501. That derivation reads a
        managed ROS 2 node's own lifecycle state where the node exposes one - `active`
        is the only ready state - and otherwise falls back to the node being present
        in the ROS graph; a component is ready unless every app it hosts is offline.
      operationId: getComponentStatus
      parameters:
      - description: The component identifier
        in: path
        name: component_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleStatusResponse'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
