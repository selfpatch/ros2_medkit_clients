  /components/{component_id}/subcomponents/{subcomponent_id}/bulk-data/{category_id}/{file_id}:
    get:
      description: Downloads a bulk-data file for a subcomponent.
      operationId: downloadSubcomponentBulkData
      parameters:
      - description: Byte range to fetch, per RFC 9110 section 14.2, e.g. `bytes=0-1023`.
          Several ranges are answered as one `multipart/byteranges` body.
        in: header
        name: Range
        required: false
        schema:
          type: string
      - description: The component identifier
        in: path
        name: component_id
        required: true
        schema:
          type: string
      - description: The subcomponent identifier
        in: path
        name: subcomponent_id
        required: true
        schema:
          type: string
      - description: The bulk data category identifier
        in: path
        name: category_id
        required: true
        schema:
          type: string
      - description: The bulk data file identifier
        in: path
        name: file_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*': {}
            application/octet-stream: {}
            application/x-mcap: {}
            application/x-sqlite3: {}
          description: Binary download
          headers:
            Accept-Ranges:
              description: '`bytes` when the download supports range requests. Absent
                otherwise.'
              schema:
                type: string
            Content-Disposition:
              description: '`attachment; filename="..."` when the download names a
                file. Absent otherwise.'
              schema:
                type: string
        '206':
          content:
            '*/*': {}
            application/octet-stream: {}
            application/x-mcap: {}
            application/x-sqlite3: {}
            multipart/byteranges: {}
          description: Requested byte range of the file
          headers:
            Accept-Ranges:
              description: '`bytes` when the download supports range requests. Absent
                otherwise.'
              schema:
                type: string
            Content-Disposition:
              description: '`attachment; filename="..."` when the download names a
                file. Absent otherwise.'
              schema:
                type: string
            Content-Range:
              description: '`bytes <start>-<end>/<total>` for the range that was served.'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Download bulk-data file for subcomponent
      tags:
      - Bulk Data
      x-medkit-partial-content: true
