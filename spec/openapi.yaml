  /components/{component_id}/logs:
    get:
      description: 'Queries application log entries for this component. Served, unless
        a LogProvider plugin is registered, from the gateway''s own log buffer and
        filtered by the entity''s log configuration: the effective severity floor
        is the stricter of that configuration and the request''s own `severity`, so
        asking for `debug` against a configuration set to `error` still returns errors
        and above; and the answer is then capped at the configuration''s `max_entries`,
        most recent kept - silently, with nothing on the response saying it was cut
        and no way to page past it. Both of those filter the answer rather than the
        buffer. A registered LogProvider serves the query itself and applies its own
        severity floor and cap instead - except on an area or a component, where the
        entity''s own logs and the namespace-prefix query are merged and the union
        is re-capped at the configuration''s `max_entries` whichever of the two produced
        it.'
      operationId: listComponentLogs
      parameters:
      - description: 'Present at any value: answer from this gateway alone and do
          not query aggregated peers. The gateway sets it on its own outbound peer
          requests, so bidirectional aggregation terminates at the first peer for
          this operation.'
        in: header
        name: X-Medkit-No-Fan-Out
        required: false
        schema:
          type: string
      - description: 'Filter by minimum severity: debug, info, warning, error, or
          fatal'
        in: query
        name: severity
        required: false
        schema:
          enum:
          - debug
          - info
          - warning
          - error
          - fatal
          type: string
      - description: Filter by logger context substring (max 256 chars)
        in: query
        name: context
        required: false
        schema:
          type: string
      - description: The component identifier
        in: path
        name: component_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntryList'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '503':
          $ref: '#/components/responses/GenericError'
