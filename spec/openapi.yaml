        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: List fault-trigger rules
      tags:
      - FaultTriggers
    post:
      description: 'Body: data_name, operator (>, <, >=, <=, ==), threshold, fault_code,
        severity (INFO|WARNING|ERROR|CRITICAL), optional active. fault_code must be
        unique across all rules (409 on duplicates). The rule is level-triggered,
        not edge-triggered: while the value stays past the threshold the engine re-reports
        the fault on every poll, so it confirms whatever the fault manager''s debounce
        threshold is and stays asserted until the value comes back. A poll that cannot
        read the source neither reports nor clears - the rule holds whatever state
        it was in, so a source that goes unreadable while the fault is asserted leaves
        it asserted.'
      operationId: createFaultTrigger
      parameters:
      - description: App (entity) to scope the rule to
        in: path
        name: app_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultTriggerRuleCreateRequest'
        description: Fault-trigger rule definition
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultTriggerRule'
          description: Created rule
          headers:
            Location:
              description: Absolute path of the created rule, API prefix included
                (`/api/v1/...`).
              schema:
                format: uri-reference
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: fault_code already used by another rule
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: Create a fault-trigger rule
      tags:
      - FaultTriggers
