  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 'JWT bearer token. Every operation states its own requirement,
        and it is the requirement this gateway enforces as configured: a scope names
        the role the permission table grants for that operation, and the empty requirement
        (`security: []`) marks an operation reachable with no token at all. The `Unauthorized`
        and `Forbidden` responses appear on exactly the operations the authentication
        middleware can refuse. Both follow `auth.enabled` together with `auth.require_auth_for`:
        under `write` the GETs carry the empty requirement and no refusal statuses,
        under `none` so does every operation, and with `auth.enabled` off the document
        drops per-operation requirements and the document-level one alike. Re-read
        the document after changing either setting - it is generated per gateway,
        not per release.'
      scheme: bearer
      type: http
info:
  contact:
    name: selfpatch.ai
    url: https://selfpatch.ai
  description: SOVD-compatible REST API for ROS 2 diagnostics and control. See https://selfpatch.github.io/ros2_medkit/
    for documentation.
  title: ROS 2 Medkit Gateway
  version: 0.7.0
  x-sovd-version: 1.0.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Returns gateway metadata, available endpoints, and capabilities.
      operationId: getRoot
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootOverview'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: API overview
      tags:
      - Server
  /apps:
    get:
      description: Lists all discovered apps (ROS 2 nodes) in the system.
      operationId: listApps
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppList'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: List apps
      tags:
      - Discovery
  /apps/{app_id}:
    get:
      description: Returns app details with capabilities and resource collection URIs.
      operationId: getApp
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Get app details
      tags:
      - Discovery
  /apps/{app_id}/belongs-to:
    get:
      description: Returns the area this app belongs to via its parent component,
        as a 0-or-1 element collection.
      operationId: getAppArea
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaList'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Get app parent area
      tags:
      - Discovery
  /apps/{app_id}/bulk-data:
    get:
      description: Lists bulk-data categories (e.g., rosbag snapshots) for this app.
      operationId: listAppBulkDataCategories
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDataCategoryList'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: List bulk-data categories for app
      tags:
      - Bulk Data
  /apps/{app_id}/bulk-data/{category_id}:
    get:
      description: Lists downloadable files in a bulk-data category for this app.
      operationId: listAppBulkDataDescriptors
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The bulk data category identifier
        in: path
        name: category_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDataDescriptorList'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: List bulk-data descriptors for app
      tags:
      - Bulk Data
    post:
      description: Uploads a file to a bulk-data category for this app.
      operationId: uploadAppBulkData
      parameters:
      - description: Identifies the calling client for lock ownership. While a lock
          protects this entity's resource collection, only the client holding it may
          write; every other caller - including one that sends no `X-Client-Id` -
          is answered 409.
        in: header
        name: X-Client-Id
        required: false
        schema:
          type: string
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The bulk data category identifier
        in: path
        name: category_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/octet-stream
              metadata:
                contentType: application/json
            schema:
              properties:
                description:
                  description: Free-text description stored alongside the file.
                  type: string
                file:
                  description: File content. The part's filename becomes the stored
                    name.
                metadata:
                  additionalProperties: true
                  description: JSON object stored alongside the file. Must be an object;
                    anything else is rejected with 400.
                  type: object
              required:
              - file
              type: object
        description: File to store in the category, with optional description and
          metadata
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDataDescriptor'
          description: File uploaded
          headers:
            Location:
              description: Absolute path of the created resource, API prefix included
                (`/api/v1/...`).
              schema:
                format: uri-reference
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '409':
          $ref: '#/components/responses/GenericError'
        '413':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Upload bulk-data for app
      tags:
      - Bulk Data
      x-medkit-lock-guarded: true
  /apps/{app_id}/bulk-data/{category_id}/{file_id}:
    delete:
      description: Deletes a bulk-data file for this app.
      operationId: deleteAppBulkData
      parameters:
      - description: Identifies the calling client for lock ownership. While a lock
          protects this entity's resource collection, only the client holding it may
          write; every other caller - including one that sends no `X-Client-Id` -
          is answered 409.
        in: header
        name: X-Client-Id
        required: false
        schema:
          type: string
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The bulk data category identifier
        in: path
        name: category_id
        required: true
        schema:
          type: string
      - description: The bulk data file identifier
        in: path
        name: file_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '409':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Delete bulk-data file for app
      tags:
      - Bulk Data
      x-medkit-lock-guarded: true
    get:
      description: Downloads a bulk-data file (binary content).
      operationId: downloadAppBulkData
      parameters:
      - description: Byte range to fetch, per RFC 9110 section 14.2, e.g. `bytes=0-1023`.
          Several ranges are answered as one `multipart/byteranges` body.
        in: header
        name: Range
        required: false
        schema:
          type: string
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The bulk data category identifier
        in: path
        name: category_id
        required: true
        schema:
          type: string
      - description: The bulk data file identifier
        in: path
        name: file_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*': {}
            application/octet-stream: {}
            application/x-mcap: {}
            application/x-sqlite3: {}
          description: Binary download
          headers:
            Accept-Ranges:
              description: '`bytes` when the download supports range requests. Absent
                otherwise.'
              schema:
                type: string
            Content-Disposition:
              description: '`attachment; filename="..."` when the download names a
                file. Absent otherwise.'
              schema:
                type: string
        '206':
          content:
            '*/*': {}
            application/octet-stream: {}
            application/x-mcap: {}
            application/x-sqlite3: {}
            multipart/byteranges: {}
          description: Requested byte range of the file
          headers:
            Accept-Ranges:
              description: '`bytes` when the download supports range requests. Absent
                otherwise.'
              schema:
                type: string
            Content-Disposition:
              description: '`attachment; filename="..."` when the download names a
                file. Absent otherwise.'
              schema:
                type: string
            Content-Range:
              description: '`bytes <start>-<end>/<total>` for the range that was served.'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Download bulk-data file for app
      tags:
      - Bulk Data
      x-medkit-partial-content: true
  /apps/{app_id}/configurations:
    delete:
      description: Resets all configuration parameters for this app.
      operationId: deleteAllAppConfigurations
      parameters:
      - description: Identifies the calling client for lock ownership. While a lock
          protects this entity's resource collection, only the client holding it may
          write; every other caller - including one that sends no `X-Client-Id` -
          is answered 409.
        in: header
        name: X-Client-Id
        required: false
        schema:
          type: string
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '207':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationDeleteMultiStatus'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '409':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Delete all configurations for app
      tags:
      - Configuration
      x-medkit-alternates: true
      x-medkit-lock-guarded: true
    get:
      description: Lists all ROS 2 node parameters for this app.
      operationId: listAppConfigurations
      parameters:
      - description: 'Present at any value: answer from this gateway alone and do
          not query aggregated peers. The gateway sets it on its own outbound peer
          requests, so bidirectional aggregation terminates at the first peer for
          this operation.'
        in: header
        name: X-Medkit-No-Fan-Out
        required: false
        schema:
          type: string
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationList'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '403':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '503':
          $ref: '#/components/responses/GenericError'
      summary: List configurations for app
      tags:
      - Configuration
  /apps/{app_id}/configurations/{config_id}:
    delete:
      description: Resets a configuration parameter to its default for this app.
      operationId: deleteAppConfiguration
      parameters:
      - description: Identifies the calling client for lock ownership. While a lock
          protects this entity's resource collection, only the client holding it may
          write; every other caller - including one that sends no `X-Client-Id` -
          is answered 409.
        in: header
        name: X-Client-Id
        required: false
        schema:
          type: string
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The configuration parameter identifier. On an entity that aggregates
          several ROS 2 nodes this is the `app_id:param_name` form the configurations
          list returns as each item's `id`, and a write of a bare parameter name is
          rejected as ambiguous; on a single-node entity it is the bare parameter
          name and a colon in it is part of the name. Maximum 512 characters.
        in: path
        name: config_id
        required: true
        schema:
          maxLength: 512
          type: string
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/GenericError'
        '403':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '409':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '503':
          $ref: '#/components/responses/GenericError'
      summary: Delete configuration for app
      tags:
      - Configuration
      x-medkit-lock-guarded: true
    get:
      description: Returns a specific ROS 2 node parameter for this app.
      operationId: getAppConfiguration
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The configuration parameter identifier. On an entity that aggregates
          several ROS 2 nodes this is the `app_id:param_name` form the configurations
          list returns as each item's `id`, and a write of a bare parameter name is
          rejected as ambiguous; on a single-node entity it is the bare parameter
          name and a colon in it is part of the name. Maximum 512 characters.
        in: path
        name: config_id
        required: true
        schema:
          maxLength: 512
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationReadValue'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '403':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '503':
          $ref: '#/components/responses/GenericError'
      summary: Get specific configuration for app
      tags:
      - Configuration
    put:
      description: Sets a ROS 2 node parameter value for this app.
      operationId: setAppConfiguration
      parameters:
      - description: Identifies the calling client for lock ownership. While a lock
          protects this entity's resource collection, only the client holding it may
          write; every other caller - including one that sends no `X-Client-Id` -
          is answered 409.
        in: header
        name: X-Client-Id
        required: false
        schema:
          type: string
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The configuration parameter identifier. On an entity that aggregates
          several ROS 2 nodes this is the `app_id:param_name` form the configurations
          list returns as each item's `id`, and a write of a bare parameter name is
          rejected as ambiguous; on a single-node entity it is the bare parameter
          name and a colon in it is part of the name. Maximum 512 characters.
        in: path
        name: config_id
        required: true
        schema:
          maxLength: 512
          type: string
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data: 85.0
            schema:
              $ref: '#/components/schemas/ConfigurationWriteRequest'
        description: ''
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationReadValue'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '403':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '409':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '503':
          $ref: '#/components/responses/GenericError'
      summary: Set configuration for app
      tags:
      - Configuration
      x-medkit-lock-guarded: true
  /apps/{app_id}/cyclic-subscriptions:
    get:
      description: Lists all cyclic subscriptions for this app.
      operationId: listAppSubscriptions
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CyclicSubscriptionList'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: List cyclic subscriptions for app
      tags:
      - Subscriptions
    post:
      description: Creates a new cyclic data subscription for this app.
      operationId: createAppSubscription
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CyclicSubscriptionCreateRequest'
        description: ''
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CyclicSubscription'
          description: Subscription created
          headers:
            Location:
              description: Absolute path of the created resource, API prefix included
                (`/api/v1/...`).
              schema:
                format: uri-reference
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '503':
          $ref: '#/components/responses/GenericError'
      summary: Create cyclic subscription for app
      tags:
      - Subscriptions
  /apps/{app_id}/cyclic-subscriptions/{subscription_id}:
    delete:
      description: Deletes a cyclic subscription from this app.
      operationId: deleteAppSubscription
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The cyclic subscription identifier
        in: path
        name: subscription_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Delete cyclic subscription for app
      tags:
      - Subscriptions
    get:
      description: Returns details of a specific subscription on this app.
      operationId: getAppSubscription
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The cyclic subscription identifier
        in: path
        name: subscription_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CyclicSubscription'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Get cyclic subscription for app
      tags:
      - Subscriptions
    put:
      description: Updates a subscription configuration on this app.
      operationId: updateAppSubscription
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The cyclic subscription identifier
        in: path
        name: subscription_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CyclicSubscriptionUpdateRequest'
        description: ''
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CyclicSubscription'
          description: Successful response
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
      summary: Update cyclic subscription for app
      tags:
      - Subscriptions
  /apps/{app_id}/cyclic-subscriptions/{subscription_id}/events:
    get:
      description: Server-Sent Events stream for subscription data on this app. Each
        frame's `data:` field is a SubscriptionEventFrame carrying either the sample
        or the reason there was none; a failed sample does not close the stream.
      operationId: streamAppSubscriptionEvents
      parameters:
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      - description: The cyclic subscription identifier
        in: path
        name: subscription_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SubscriptionEventFrame'
          description: Server-Sent Events stream
          headers:
            Cache-Control:
              description: Always `no-cache`; event streams are never cached.
              schema:
                type: string
            X-Accel-Buffering:
              description: Always `no`; disables response buffering in nginx-style
                proxies.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
        '501':
          $ref: '#/components/responses/GenericError'
      summary: SSE events stream for cyclic subscription on app
      tags:
      - Subscriptions
  /apps/{app_id}/data:
    get:
      description: Lists all data items (ROS 2 topics) available on this app.
      operationId: listAppData
      parameters:
      - description: 'Present at any value: answer from this gateway alone and do
          not query aggregated peers. The gateway sets it on its own outbound peer
          requests, so bidirectional aggregation terminates at the first peer for
          this operation.'
        in: header
        name: X-Medkit-No-Fan-Out
        required: false
        schema:
          type: string
      - description: The app identifier
        in: path
        name: app_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataListResult'
