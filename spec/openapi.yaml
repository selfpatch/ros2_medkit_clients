        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultTriggerRuleList'
          description: Rule list
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
