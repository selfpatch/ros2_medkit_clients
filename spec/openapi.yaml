          type: string
      - description: The bulk data file identifier
        in: path
        name: file_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*': {}
            application/octet-stream: {}
            application/x-mcap: {}
            application/x-sqlite3: {}
          description: Binary download
          headers:
            Accept-Ranges:
              description: '`bytes` when the download supports range requests. Absent
                otherwise.'
              schema:
                type: string
            Content-Disposition:
              description: '`attachment; filename="..."` when the download names a
                file. Absent otherwise.'
              schema:
                type: string
        '206':
          content:
            '*/*': {}
            application/octet-stream: {}
            application/x-mcap: {}
            application/x-sqlite3: {}
            multipart/byteranges: {}
          description: Requested byte range of the file
          headers:
            Accept-Ranges:
              description: '`bytes` when the download supports range requests. Absent
                otherwise.'
              schema:
                type: string
            Content-Disposition:
              description: '`attachment; filename="..."` when the download names a
                file. Absent otherwise.'
              schema:
                type: string
            Content-Range:
              description: '`bytes <start>-<end>/<total>` for the range that was served.'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/GenericError'
        '404':
          $ref: '#/components/responses/GenericError'
        '416':
          $ref: '#/components/responses/GenericError'
        '500':
          $ref: '#/components/responses/GenericError'
