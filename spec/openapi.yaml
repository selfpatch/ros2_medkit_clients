    get:
      description: Downloads a bulk-data file (binary content).
      operationId: downloadFunctionBulkData
      parameters:
      - description: Byte range to fetch, per RFC 9110 section 14.2, e.g. `bytes=0-1023`.
          Several ranges are answered as one `multipart/byteranges` body.
        in: header
        name: Range
        required: false
        schema:
          type: string
      - description: The function identifier
        in: path
        name: function_id
        required: true
        schema:
