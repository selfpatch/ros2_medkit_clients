    DataListResult:
      anyOf:
      - $ref: '#/components/schemas/DataList'
      - additionalProperties: true
        description: Plugin-defined list. The in-tree OPC-UA plugin adds value / unit
          / data_type / writable per item. Read the plugin's own documentation.
        title: PluginDataList
        type: object
        x-medkit-opaque: true
      description: 'Data-resource list whose shape depends on who owns the entity.
        An entity backed by the ROS 2 graph answers with `DataList`. A plugin-owned
        entity answers with whatever its DataProvider returns and the gateway emits
        that verbatim. Which branch applies is discoverable ahead of the call: `x-medkit.source`
        on the entity''s own document (`GET /{entity_type}/{entity_id}`) reads `plugin`
        for a plugin-owned entity.'
    DataListXMedkit:
      properties:
        aggregated:
          anyOf:
          - type: boolean
          - type: 'null'
        aggregation_level:
          anyOf:
          - type: string
          - type: 'null'
        aggregation_sources:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
        entity_id:
          anyOf:
          - type: string
          - type: 'null'
        failed_peers:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
        partial:
          anyOf:
          - type: boolean
          - type: 'null'
        peer_dropped_items:
          anyOf:
          - items:
              $ref: '#/components/schemas/DroppedItem'
            type: array
          - type: 'null'
        peer_failures:
          anyOf:
          - items:
              $ref: '#/components/schemas/PeerFailure'
            type: array
          - type: 'null'
        total_count:
          anyOf:
          - type: integer
          - type: 'null'
      type: object
    DataValue:
      additionalProperties: true
      description: 'One data resource''s value. No fixed shape exists: on the ROS
        2 path the body carries the live message, whose fields come from the topic''s
        IDL type, and on a plugin-owned entity it carries whatever the DataProvider
        returns (an OPC-UA node adds unit / data_type / writable, a UDS DID its own
        record layout). Discover the concrete shape from the item''s entry in `GET
        /{entity_type}/{entity_id}/data`, whose `x-medkit` names the ROS 2 message
        type.'
      type: object
      x-medkit-opaque: true
    DataWriteRequest:
      properties:
        data: {}
        type:
          type: string
      required:
      - type
      - data
      type: object
    DroppedItem:
      properties:
        peer:
