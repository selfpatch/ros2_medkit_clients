  /functions/{function_id}/logs:
    get:
      description: 'Queries application log entries for this function. Served, unless
        a LogProvider plugin is registered, from the gateway''s own log buffer and
        filtered by the entity''s log configuration: the effective severity floor
        is the stricter of that configuration and the request''s own `severity`, so
        asking for `debug` against a configuration set to `error` still returns errors
        and above; and the answer is then capped at the configuration''s `max_entries`,
        most recent kept - silently, with nothing on the response saying it was cut
        and no way to page past it. Both of those filter the answer rather than the
        buffer. A registered LogProvider serves the query itself and applies its own
        severity floor and cap instead - except on an area or a component, where the
        entity''s own logs and the namespace-prefix query are merged and the union
        is re-capped at the configuration''s `max_entries` whichever of the two produced
        it.'
