            type: string
          - type: 'null'
          description: JSON Pointer (RFC 6901) selecting the part of the observed
            resource the condition is evaluated against, e.g. `/data/temperature`.
            Omit it to evaluate the whole value. An update in which the pointer does
            not resolve is skipped rather than treated as a change, so a pointer that
            never matches yields a trigger that never fires. Maximum 1024 characters.
